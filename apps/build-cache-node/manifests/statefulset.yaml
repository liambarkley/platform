apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: build-cache-node
  labels:
    app: build-cache-node
spec:
  serviceName: build-cache-node
  replicas: 1
  # Kubernetes retains StatefulSet-generated PVCs on deletion by default (data safety) - found
  # the hard way while tearing this down for the night: the Application's own cascade-delete
  # doesn't touch this PVC either, since it's generated from volumeClaimTemplates below, not a
  # manifest ArgoCD applied directly, so it was left Bound (and its EBS volume undeleted) after
  # the whole app was removed. whenDeleted: Delete is correct here specifically because this is
  # a cache with no data worth preserving across a full redeploy - whenScaled stays the default
  # (Retain), since a temporary scale-down to 0 shouldn't nuke the cache.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  selector:
    matchLabels:
      app: build-cache-node
  template:
    metadata:
      labels:
        app: build-cache-node
    spec:
      # ConfigMap-backed volumes always mount read-only, even with subPath - but the app
      # rejects a read-only config.yaml outright ("Config file must be writable"), confirmed
      # against the live pod before writing this. Standard fix: copy the ConfigMap's version
      # onto the writable PVC once at startup, then the main container never touches the
      # ConfigMap mount directly.
      initContainers:
        - name: copy-config
          image: gradle/build-cache-node:21.2
          command: ["sh", "-c", "mkdir -p /data/conf && cp /config-source/config.yaml /data/conf/config.yaml"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config-source
              mountPath: /config-source
      containers:
        - name: build-cache-node
          image: gradle/build-cache-node:21.2
          args: ["start"]
          ports:
            - name: http
              containerPort: 5071
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # /ping - documented, unauthenticated regardless of access-control settings
          # (everything else, including /, returns 401 without real credentials - confirmed
          # against the live pod before using this).
          readinessProbe:
            httpGet:
              path: /ping
              port: 5071
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 5071
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: config-source
          configMap:
            name: build-cache-node-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        # Matches the image's own default max cache size (10 GiB) - no point provisioning more
        # disk than the application itself will ever fill, until that default is deliberately
        # raised.
        resources:
          requests:
            storage: 10Gi

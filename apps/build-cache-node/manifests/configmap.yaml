apiVersion: v1
kind: ConfigMap
metadata:
  name: build-cache-node-config
data:
  # anonymousLevel "read": anyone can pull cache entries with no credentials (normal for a
  # build cache - PR builds from forks, etc. shouldn't need a secret just to read). Writing
  # requires the "ci" user. Its password hash below is safe to commit - it's a one-way salted
  # hash (`java -jar build-cache-node.jar hash`, run interactively against the live pod so the
  # plain password was never typed anywhere I could see it, log, or commit - see
  # platform/docs/postmortems or the README's "Access control" section for the exact steps).
  # The plain password itself lives only with Liam, for a future GitHub Actions secret.
  config.yaml: |
    version: 5
    cache:
      accessControl:
        anonymousLevel: "read"
        users:
          ci:
            password: "n8vIY8STrAmqbh4MOXakJs2E+eaChYzZ/Dy2bKs4vGQ=:R+osFliwciWMYs7llsz3k/oPfHV45pNwOT6YZqpCR0s="
            level: "readwrite"

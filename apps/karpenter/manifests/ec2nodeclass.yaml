apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  # Pre-created by Terraform (infra/modules/eks's aws_iam_instance_profile.node), not the
  # EC2NodeClass's alternative `role` field - Karpenter would otherwise need extra IAM
  # permissions (iam:CreateInstanceProfile etc.) it doesn't have, and this way the instance
  # profile stays a Terraform-owned resource, not something Karpenter manages on its own.
  instanceProfile: build-cache-dev-eks-node
  subnetSelectorTerms:
    # Matches every private subnet infra/modules/network creates - no need to name them, or
    # the VPC, individually.
    - tags:
        kubernetes.io/role/internal-elb: "1"
  securityGroupSelectorTerms:
    # The cluster security group EKS creates and tags automatically - not a custom one, since
    # nothing here needs node-to-node rules beyond what the cluster SG already allows.
    - tags:
        aws:eks:cluster-name: build-cache-dev
  # EKS's own default caps IMDS at one network hop (httpPutResponseHopLimit 1) - fine for the
  # host, but a pod is one hop further out, so any pod needing instance metadata (e.g.
  # auto-detecting its VPC ID) times out reaching it on a default node. Confirmed on the
  # system node group's instances via `aws ec2 describe-instances` before fixing this there
  # (infra/modules/eks's aws_launch_template.system_node) - applying the same fix here so a
  # pod that happens to land on a Karpenter-provisioned node instead doesn't hit it too.
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 2
  tags:
    project: build-cache
    Module: karpenter

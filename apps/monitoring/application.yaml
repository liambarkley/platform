apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "92.16.2"
      helm:
        releaseName: monitoring
        valuesObject:
          # Disables the whole admission-webhook Helm-hook chain (a ServiceAccount, Cluster-
          # Role(Binding), Role(Binding), and two Jobs that generate/patch a webhook cert) -
          # confirmed live: it repeatedly deadlocked ArgoCD's sync, waiting on a hook resource
          # that Replace+prune's delete-then-recreate cycle had already deleted out from under
          # it, with nothing left to recreate it. Helm hooks and ArgoCD's reconciliation model
          # are a known rough combination generally, not specific to a mistake in this config.
          # The webhook only validates PrometheusRule/Probe CR syntax at admission time - a
          # nice-to-have, not needed for this project; a syntax error in slo-burn-rate-rules.yaml
          # would still surface via `kubectl describe prometheusrule` instead.
          prometheusOperator:
            admissionWebhooks:
              enabled: false
          prometheus:
            prometheusSpec:
              retention: 3d
              # gp3, not the chart's default (none - PVCs are opt-in) - 8Gi comfortably covers
              # 3 days of this project's low cardinality/volume. Running cost: ~US$0.64/month
              # for the EBS volume if left up continuously, effectively a few cents per session
              # given this project destroys envs/dev between sessions (docs/PLAN.md's cost
              # section) - flagged per CLAUDE.md, not applied without Liam's apply either way.
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: gp3
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 8Gi
              # Without these, the chart's Prometheus only watches ServiceMonitors/
              # PodMonitors/PrometheusRules it created itself - cloudwatch-exporter.yaml's
              # ServiceMonitor and slo-burn-rate-rules.yaml's PrometheusRule would be silently
              # ignored otherwise.
              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelectorNilUsesHelmValues: false
              ruleSelectorNilUsesHelmValues: false
              # Explicit, not left to the chart's default: demo-spring-app's ServiceMonitor
              # (apps/demo-spring-app/manifests/servicemonitor.yaml) lives in the
              # demo-spring-app namespace, not monitoring - an empty selector matches every
              # namespace, a nil one would only match Prometheus's own.
              serviceMonitorNamespaceSelector: {}
              podMonitorNamespaceSelector: {}
              ruleNamespaceSelector: {}
          alertmanager:
            alertmanagerSpec:
              replicas: 1
              retention: 24h
            config:
              global:
                resolve_timeout: 5m
              route:
                receiver: email-bridge
                group_by: ["alertname", "slo", "severity"]
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 4h
              receivers:
                # Not SMTP: SES's SMTP endpoint needs an IAM user, which this account's
                # landing-zone SCP flatly denies (infra/landing-zone/scps.tf,
                # DenyIamUserAndAccessKeyCreation) - confirmed live, not a guess. Posts to
                # infra/modules/alerting's Lambda-behind-API-Gateway bridge instead, which
                # calls SES's SendEmail API using its own execution role (a role, not a user -
                # the SCP doesn't touch it). See that module's README for the full story.
                #
                # The url below has to be hand-copied again from infra/modules/alerting's
                # webhook_url output every time envs/dev is destroyed and recreated - same
                # category of manual step as demo-spring-app's BUILD_CACHE_URL, and for the
                # same reason (an AWS-generated value with no fixed name to read it back by).
                # scripts/up.sh prints it. Current value confirmed live 2026-11-03 against a
                # real apply (API Gateway id omk0f01u0k).
                - name: email-bridge
                  webhook_configs:
                    - url: "https://omk0f01u0k.execute-api.ca-central-1.amazonaws.com/alert"
                      send_resolved: true
          grafana:
            defaultDashboardsEnabled: true
            sidecar:
              dashboards:
                enabled: true
                label: grafana_dashboard
                labelValue: "1"
            # Ephemeral, not persisted - dashboards are code (this app's manifests/), so
            # nothing here would be lost on a pod restart worth paying for an extra EBS volume.
            persistence:
              enabled: false
    # Everything that isn't the chart itself: the CloudWatch exporter substituting for the
    # Build Cache Node's missing metrics endpoint, the SLO burn-rate PrometheusRule, and the
    # custom Grafana dashboard.
    - repoURL: https://github.com/liambarkley/platform.git
      targetRevision: main
      path: apps/monitoring/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Confirmed live, same session: without this, ArgoCD's default client-side apply
      # silently fails on this chart's largest CRDs (Prometheus, Alertmanager,
      # AlertmanagerConfig, ScrapeConfig, PrometheusAgent, ThanosRuler) - they exceed the
      # kubectl.kubernetes.io/last-applied-configuration annotation's 262144-byte limit.
      # Server-side apply doesn't use that annotation at all. A known kube-prometheus-stack-
      # on-ArgoCD gotcha, not specific to anything else in this app.
      - ServerSideApply=true
      # Confirmed live: ServerSideApply alone still isn't enough on this install (v3.5.6) - a
      # real, confirmed-upstream regression (argoproj/argo-cd#28421, fixed in neither v3.5.0
      # nor this version): even with ServerSideApply=true, the dry-run validation step still
      # runs as client-side apply + server dry-run for any resource over 256KiB, sending the
      # oversized last-applied-configuration annotation and getting rejected before the real
      # (correctly server-side) apply ever runs. The maintainers' own documented workaround is
      # adding Replace=true alongside ServerSideApply=true specifically to skip that broken
      # dry-run path. `argocd app sync` (the manual CLI/API path, server/application/
      # application.go's Sync RPC) separately refuses Replace via a server-level
      # syncWithReplaceAllowed flag - but that check is specific to that one RPC handler, not
      # the application-controller's own automated/selfHeal reconciliation loop, which runs
      # through gitops-engine directly and never calls it. Set here, synced via selfHeal
      # (automated above), not via `argocd app sync`.
      - Replace=true
